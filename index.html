<style>

.pd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral);margin-left:3px}
.gd{flex:1;text-align:center;padding:8px 2px;border-radius:14px;background:rgba(127,127,127,.18);font-size:.72rem;line-height:1.3}.gd.on{background:var(--sun);color:#3a2a00}.gd.ok{background:var(--leaf);color:#fff}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:10px}.bar1{flex:1;text-align:center;font-size:.75rem;display:flex;flex-direction:column;justify-content:flex-end;gap:3px}
.bar1 i{display:block;border-radius:8px 8px 0 0;background:var(--sun)}.bar1.t i{background:var(--leaf)}
.lvr{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid rgba(127,127,127,.2)}
.pav{width:96px;height:96px;border-radius:50%;background:#fff3c4;display:grid;place-items:center;font-size:3.6rem;margin:0 auto 8px;box-shadow:0 5px 0 var(--sh)}
.avg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.avb{border:0;border-radius:18px;background:rgba(127,127,127,.15);font-size:2rem;padding:8px 0;cursor:pointer}.avb.on{background:var(--sun)}
.ov{position:fixed;inset:0;background:rgba(20,15,45,.72);display:grid;place-items:center;z-index:100;padding:20px}
.pb{width:100%;max-width:360px;text-align:center;margin:0}
.pb input{letter-spacing:.5em}
.lbl{margin:0 0 4px 4px;color:var(--soft);font-size:.9rem}
.g{background-image:linear-gradient(160deg,rgba(255,255,255,.26),rgba(0,0,0,.14))}
.g .e{width:66px;height:66px;font-size:2.4rem;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2),inset 0 -3px 0 rgba(0,0,0,.07);transition:transform .15s}
.g:active .e{transform:scale(.9) rotate(-6deg)}
.wh{font-size:3.4rem;text-align:center;display:block}.wh.spin{animation:sp .9s ease-in-out}@keyframes sp{to{transform:rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="app"></div>
<script>
var STAGES=["🌰","🌱","🌿","🪴","🌳","🍎"],PER=10;
var S={name:"",stars:0,streak:0,last:"",sound:true,best:{},total:null,inv:[],shelf:[],medals:[],voice:true,boxes:0,hist:{},gift:"",avatar:"",tries:0,right:0,level:1,gs:{},time:{},extra:{},pin:"",limit:0};
try{var raw=localStorage.getItem("ilmjon");if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
if(typeof S.total!=="number")S.total=S.stars;
function save(){try{localStorage.setItem("ilmjon",JSON.stringify(S))}catch(e){}}
function dayStr(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
(function(){var t=new Date(),y=new Date(t.getTime()-864e5),a=dayStr(t);
 if(S.last!==a){S.streak=(S.last===dayStr(y))?S.streak+1:1;S.last=a;S.maxStreak=Math.max(S.maxStreak||0,S.streak);save()}})();
var app=document.getElementById("app");
function $(h){var d=document.createElement("div");d.innerHTML=h;return d.firstChild}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function stage(){return Math.min(STAGES.length-1,Math.floor(S.total/PER))}
function logo(){return '<svg viewBox="0 0 100 100" aria-label="Ilmjon"><rect width="100" height="100" rx="24" fill="#6b46b8"/><path d="M50 80C38 72 24 72 12 76V44C24 40 38 40 50 48Z" fill="#fff"/><path d="M50 80C62 72 76 72 88 76V44C76 40 62 40 50 48Z" fill="#ffe9a8"/><path d="M50 48V30" stroke="#3fae66" stroke-width="5" stroke-linecap="round"/><path d="M50 35C40 35 33 29 32 20C43 20 49 26 50 35Z" fill="#3fae66"/><path d="M50 31C60 31 67 25 68 16C57 16 51 22 50 31Z" fill="#7ad27a"/><circle cx="38" cy="60" r="3" fill="#2b2350"/><circle cx="62" cy="60" r="3" fill="#2b2350"/><path d="M44 66Q50 72 56 66" stroke="#2b2350" stroke-width="3" fill="none" stroke-linecap="round"/></svg>'}
/* tovush */
var ac;function tone(f,d,t){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type=t||"sine";g.gain.setValueAtTime(.15,ac.currentTime+d.s);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d.s+d.l);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+d.s);o.stop(ac.currentTime+d.s+d.l)}catch(e){}}
function sOk(){tone(660,{s:0,l:.15});tone(880,{s:.12,l:.25})}
function sNo(){tone(180,{s:0,l:.3},"triangle")}
function sWin(){[523,659,784,1047].forEach(function(f,i){tone(f,{s:i*.12,l:.25})})}

/* savollar */
var LET=[["🍎","Olma","O"],["🐱","Mushuk","M"],["🐟","Baliq","B"],["🐰","Quyon","Q"],["🦁","Sher","S"],["🐪","Tuya","T"],["🌸","Gul","G"],["🍞","Non","N"],["🏠","Uy","U"],["🐻","Ayiq","A"],["📘","Kitob","K"],["🌳","Daraxt","D"],["✏️","Qalam","Q"]];
var ABC="ABDGKMNOQSTU".split("");
var COL=[["Qizil","#e53935"],["Koʻk","#1e88e5"],["Sariq","#fdd835"],["Yashil","#43a047"],["Toʻq sariq","#fb8c00"],["Binafsha","#8e24aa"],["Pushti","#f06292"],["Qora","#212121"]];
var ANI=[["🐱","Mushuk"],["🐶","It"],["🐄","Sigir"],["🐑","Qoʻy"],["🐴","Ot"],["🐔","Tovuq"],["🦁","Sher"],["🐘","Fil"],["🐒","Maymun"],["🐸","Baqa"],["🐟","Baliq"],["🐰","Quyon"]];
function uniq(ans,gen){var s={};s[ans]=1;while(Object.keys(s).length<4)s[gen()]=1;return shuffle(Object.keys(s))}
function LVI(){return Math.min(2,Math.max(0,(S.level||1)-1))}
function qCount(){var mx=[5,10,20][LVI()],n=1+rnd(mx),p=["🍎","🐟","⭐","🎈","🐞","🍓"],e=p[rnd(p.length)];return{q:"Nechta bor?",show:new Array(n+1).join(e),ans:String(n),opts:uniq(String(n),function(){return 1+rnd(mx)})}}
function qLetter(){var w=LET[rnd(LET.length)];return{q:w[1]+" qaysi harfdan boshlanadi?",show:w[0],ans:w[2],opts:uniq(w[2],function(){return ABC[rnd(ABC.length)]})}}
function qColor(){var c=COL[rnd(COL.length)],n=shuffle(COL.filter(function(x){return x[0]!==c[0]})).slice(0,3).map(function(x){return x[0]});return{q:"Bu qanday rang?",dot:c[1],ans:c[0],opts:shuffle(n.concat(c[0]))}}
function qMath(){var mx=[5,10,20][LVI()],a=1+rnd(mx),b=1+rnd(mx),r;
 if(rnd(2)){r=a+b;return{q:"Natijani top",show:a+" + "+b+" = ?",ans:String(r),opts:uniq(String(r),function(){return Math.max(0,r+rnd(7)-3)})}}
 if(a<b){var t=a;a=b;b=t}r=a-b;return{q:"Natijani top",show:a+" − "+b+" = ?",ans:String(r),opts:uniq(String(r),function(){return Math.max(0,r+rnd(7)-3)})}}
function qAni(){var a=ANI[rnd(ANI.length)],n=shuffle(ANI.filter(function(x){return x[1]!==a[1]})).slice(0,3).map(function(x){return x[1]});return{q:"Bu kim?",show:a[0],ans:a[1],opts:shuffle(n.concat(a[1]))}}

var SHP=[["🔺","Uchburchak"],["🟦","Kvadrat"],["⭕","Aylana"],["⭐","Yulduz"],["❤️","Yurak"],["🔷","Romb"]];
function qShape(){var a=SHP[rnd(SHP.length)],n=shuffle(SHP.filter(function(x){return x[1]!==a[1]})).slice(0,3).map(function(x){return x[1]});return{q:"Bu qanday shakl?",show:a[0],ans:a[1],opts:shuffle(n.concat(a[1]))}}
var OPP=[["Katta","Kichik"],["Issiq","Sovuq"],["Tez","Sekin"],["Uzun","Qisqa"],["Kun","Tun"],["Baland","Past"],["Yaxshi","Yomon"],["Toʻla","Boʻsh"]];
function qOpp(){var p=OPP[rnd(OPP.length)],f=rnd(2),w=p[f],a=p[1-f],all=[];OPP.forEach(function(x){if(x!==p)all=all.concat(x)});
 return{q:"Qarama-qarshisini top",show:w,ans:a,opts:shuffle(shuffle(all).slice(0,3).concat(a))}}
function qBig(){var mx=[10,30,100][LVI()],s={};while(Object.keys(s).length<4)s[1+rnd(mx)]=1;var k=Object.keys(s).map(Number);return{q:"Qaysi son eng katta?",show:"🔼",ans:String(Math.max.apply(null,k)),opts:shuffle(k.map(String))}}
function qSeq(){var st=1+rnd(5),d=[[1,2],[1,2,3,5],[2,3,5,10]][LVI()],dd=d[rnd(d.length)],r=st+3*dd;return{q:"Navbatdagi sonni top",show:st+", "+(st+dd)+", "+(st+2*dd)+", ?",ans:String(r),opts:uniq(String(r),function(){return Math.max(1,r+rnd(9)-4)})}}
var GRP=[["🍎","🍌","🍇","🍓","🍉"],["🐱","🐶","🐴","🐄","🐑"],["🚗","🚌","🚲","🚂","🚀"],["⚽","🏀","🎾","🏐","🥎"]];
function qOdd(){var g=shuffle(GRP),a=shuffle(g[0]).slice(0,3),o=g[1][rnd(5)];return{q:"Qaysi biri ortiqcha?",show:"🤔",ans:o,opts:shuffle(a.concat(o))}}
/* yangi oʻyinlar */
var homeSub="all",SUBS=[["math","➕ Matematika"],["lang","🔤 Til"],["world","🌍 Atrof-olam"],["logic","🧩 Mantiq"]],LVN=["🟢 Oson","🟡 Oʻrta","🔴 Qiyin"];
function speakF(t){var w=S.voice;S.voice=true;speak(t);S.voice=w}
function qMul(){var L=LVI(),a=L===0?[2,5,10][rnd(3)]:L===1?2+rnd(4):2+rnd(8),b=1+rnd(L===0?5:10),r=a*b;
 return{q:"Natijani top",show:a+" × "+b+" = ?",ans:String(r),opts:uniq(String(r),function(){return Math.max(1,r+(rnd(7)-3)*(L===0?a:1))})}}
var CLK=["🕛","🕐","🕑","🕒","🕓","🕔","🕕","🕖","🕗","🕘","🕙","🕚"],CLH=["🕧","🕜","🕝","🕞","🕟","🕠","🕡","🕢","🕣","🕤","🕥","🕦"];
function qClock(){var L=LVI(),h=rnd(12),half=L>0&&rnd(2)===1,hr=h===0?12:h;
 function t(x,hf){return x+":"+(hf?"30":"00")}
 var ans=t(hr,half);return{q:"Soat nechchi?",show:(half?CLH:CLK)[h],ans:ans,opts:uniq(ans,function(){return t(1+rnd(12),L>0&&rnd(2)===1)})}}
function qRead(){var w=LET[rnd(LET.length)],o=shuffle(LET.filter(function(x){return x[1]!==w[1]})).slice(0,3).map(function(x){return x[0]});
